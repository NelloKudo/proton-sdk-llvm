name: Push proton-sdk-arm64 to DockerHub

on:
  push:
    tags: 
      - 'proton-sdk-arm64-*'

jobs:
  docker:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUBNAME }}
          password: ${{ secrets.DOCKERHUBCI }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Proton SDK using Proton's Makefile
        working-directory: ./Proton/docker
        run: make BUILD_ARCH=aarch64 proton-llvm

      - name: Retag and push to Docker Hub
        run: |
          SRC_TAG="registry.gitlab.steamos.cloud/proton/sniper/sdk/arm64/llvm:latest"
          DST_USER="sherrydck"
          DST_NAME="proton-sdk-arm64"
          DST_TAG="${{ github.ref_name }}"
          docker tag "$SRC_TAG" "$DST_USER/$DST_NAME:$DST_TAG"
          docker tag "$SRC_TAG" "$DST_USER/$DST_NAME:latest"
          docker push "$DST_USER/$DST_NAME:$DST_TAG"
          docker push "$DST_USER/$DST_NAME:latest"